# PointNet++ for NailSeg binary part segmentation
# Usage: python examples/nailseg/main.py --cfg cfgs/nailseg/pointnet++.yaml

model:
  NAME: BasePartSeg
  encoder_args:
    NAME: PointNet2Encoder
    in_channels: 7   # xyz(3) + features(3) + heights(1)
    width: null
    strides: [1, 2, 2, 2]
    layers: 3
    use_res: False
    mlps: [[[32, 32, 64]],
        [[64, 64, 128]],
        [[128, 128, 256]],
        [[256, 256, 512]]]
    radius: 0.1
    num_samples: 32
    sampler: fps
    aggr_args:
      NAME: 'convpool'
      feature_type: 'dp_fj'
      anisotropic: False
      reduction: 'max'
    group_args:
      NAME: 'ballquery'
      use_xyz: True
    conv_args:
      order: conv-norm-act
    act_args:
      act: 'relu'
    norm_args:
      norm: 'bn'
  decoder_args:
    NAME: PointNextPartDecoder
    cls_map: curvenet
  cls_args:
    NAME: SegHead
    global_feat: max,avg
    num_classes: 2
    in_channels: null
    norm_args:
      norm: 'bn'

# ---------------------------------------------------------------------------- #
# Training cfgs
# ---------------------------------------------------------------------------- #
lr: 0.001
min_lr: null
optimizer:
  NAME: adamw
  weight_decay: 1.0e-4

criterion_args:
  NAME: Poly1FocalLoss

# scheduler
epochs: 300
sched: multistep
decay_epochs: [210, 270]
decay_rate: 0.1
warmup_epochs: 0

datatransforms:
  train: [PointsToTensor, PointCloudScaling, PointCloudCenterAndNormalize, PointCloudJitter, ChromaticDropGPU]
  val: [PointsToTensor, PointCloudCenterAndNormalize]
  vote: [PointCloudScaling]
  kwargs:
    jitter_sigma: 0.001
    jitter_clip: 0.005
    scale: [0.8, 1.2]
    gravity_dim: 1
    angle: [0, 1.0, 0]
