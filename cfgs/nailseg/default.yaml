# ---------------------------------------------------------------------------- #
# NailSeg dataset configuration (ShapeNetPart-style part segmentation)
# ---------------------------------------------------------------------------- #
# Data: pre-split .npy files (N×7), columns 0-2 = xyz, 3-5 = features,
#       column 6 = label (0 = non-nail, 1 = nail).
# Directory layout: data_root/{train,val,test}/*.npy
# ---------------------------------------------------------------------------- #
dataset:
  common:
    NAME: NailSeg
    data_root: data/nailseg
    num_points: 2048
  train:
    split: train
  val:
    split: val
    presample: False
  test:
    split: test
    presample: False

num_classes: 2
shape_classes: 1
num_points: 2048
normal_channel: True
feature_keys: pos,x,heights

datatransforms:
  train: [PointsToTensor, PointCloudScaling, PointCloudCenterAndNormalize, PointCloudJitter, ChromaticDropGPU]
  val: [PointsToTensor, PointCloudCenterAndNormalize]
  vote: [PointCloudScaling]
  kwargs:
    jitter_sigma: 0.001
    jitter_clip: 0.005
    scale: [0.8, 1.2]
    gravity_dim: 1
    angle: [0, 1.0, 0]

batch_size: 8
dataloader:
  num_workers: 6

# ---------------------------------------------------------------------------- #
# Evaluation cfgs
# ---------------------------------------------------------------------------- #
num_votes: 10
refine: True

# ---------------------------------------------------------------------------- #
# Training cfgs
# ---------------------------------------------------------------------------- #
lr: 0.001
min_lr: null
optimizer:
  NAME: adamw
  weight_decay: 1.0e-4

criterion_args:
  NAME: Poly1FocalLoss

# scheduler
epochs: 300
sched: multistep
decay_epochs: [210, 270]
decay_rate: 0.1
warmup_epochs: 0

sched_on_epoch: True

grad_norm_clip: 1
use_voting: False

# ---------------------------------------------------------------------------- #
# io and misc
# ---------------------------------------------------------------------------- #
print_freq: 10
val_freq: 1

# ----------------- Model related
pretrained_path: null

wandb:
  project: PointNext-NailSeg
